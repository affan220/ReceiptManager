services:
  - type: web
    name: masjid-receipt-manager-backend
    env: node
    buildCommand: npm --prefix server install && npm --prefix server run build
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: masjid-receipt-manager-frontend
    env: static
    buildCommand: npm --prefix client install && npm --prefix client run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
